spring.application.name=Mina-Portfolio-Management
server.port=9001

spring.datasource.url=jdbc:mysql://localhost:3306/portfolioDb?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.task.scheduling.time-zone=Asia/Shanghai

deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-v4-flash

# CoinGecko Demo API configuration.
# The real key is stored in the Windows environment variable, not in Git.
coingecko.api-key=${COINGECKO_API_KEY:}
coingecko.base-url=https://api.coingecko.com/api/v3

# Twelve Data Mutual Fund configuration.
# The real key is stored in the Windows environment variable, not in Git.
twelvedata.api-key=${TWELVE_DATA_API_KEY:}
twelvedata.base-url=https://api.twelvedata.com
